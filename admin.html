<!doctype html><html lang="my"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - NEXPROPERTY</title><link rel="stylesheet" href="admin.css"></head><body><header><b>⚙️ <span id="adminSiteName">NEXPROPERTY</span> Admin</b><button onclick="logout()">ထွက်မည်</button></header><main><section class="panel"><h2>🎨 Website ကို စိတ်ကြိုက်ပြင်ရန်</h2><form id="settingsForm"><input name="siteName" placeholder="Website နာမည်"><input name="tagline" placeholder="အပေါ်စာတန်း"><div class="two"><input name="heroTitle" placeholder="အဓိကခေါင်းစဉ်"><input name="heroAccent" placeholder="အပြာရောင်စာသား"></div><textarea name="heroText" placeholder="ပင်မစာသား"></textarea><div class="two"><input name="phone" placeholder="ဖုန်းနံပါတ်"><input name="address" placeholder="လိပ်စာ / မြို့"></div><div class="two"><input name="logo" placeholder="Logo emoji ဥပမာ 🏠"><input name="primaryColor" placeholder="အဓိကအရောင် ဥပမာ #087a73"></div><button>💾 ပြင်ဆင်ပြီး သိမ်းမည်</button></form></section><section class="panel"><h2>🏠 Property အသစ်ထည့်ရန်</h2><form id="form" enctype="multipart/form-data"><input name="title" placeholder="Property အမည်" required><div class="two"><select name="type"><option>အိမ်</option><option>ခြံ</option><option>ကွန်ဒို</option><option>ဆိုင်ခန်း</option></select><select name="purpose"><option>ရောင်း</option><option>ငှား</option></select></div><input name="location" placeholder="တည်နေရာ" required><input name="price" placeholder="ဈေးနှုန်း" required><input name="phone" placeholder="ဖုန်း" required><input name="image" placeholder="Image URL (သို့) အောက်မှာ file ရွေးပါ"><input name="imageFile" type="file" accept="image/*"><textarea name="description" placeholder="အကြောင်းအရာ"></textarea><button>+ ထည့်မည်</button></form></section><section class="panel"><h2>🏠 Property စာရင်း</h2><div id="list"></div></section></main><script src="admin.js"></script></body></html>
