<!doctype html><html lang="my"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXPROPERTY</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="nav"><div class="logo"><span id="logoIcon">🏠</span> <b id="siteName">NEXPROPERTY</b></div><nav><a href="#home">ပင်မ</a><a href="#properties">အိမ်ခြံမြေ</a><a href="#contact">ဆက်သွယ်ရန်</a><button onclick="openLogin()">Admin</button></nav></div></header>
<section id="home" class="hero"><div><span id="tagline">🏡 ယုံကြည်စိတ်ချရသော အိမ်ခြံမြေ</span><h1><span id="heroTitle">သင့်အိပ်မက်အိမ်ကို</span><br><b id="heroAccent">ဒီမှာရှာပါ</b></h1><p id="heroText">အိမ်၊ ခြံ၊ ကွန်ဒို၊ ဆိုင်ခန်းများကို လွယ်ကူမြန်ဆန်စွာ ရှာဖွေပါ။</p></div></section>
<div class="search"><select id="type"><option value="">အမျိုးအစားအားလုံး</option><option>အိမ်</option><option>ခြံ</option><option>ကွန်ဒို</option><option>ဆိုင်ခန်း</option></select><input id="loc" placeholder="မြို့နယ် / တည်နေရာ"><select id="purpose"><option value="">ရောင်း / ငှား</option><option>ရောင်း</option><option>ငှား</option></select><button onclick="render()">🔍 ရှာမည်</button></div>
<main id="properties"><div class="head"><h2>အိမ်ခြံမြေများ</h2><span id="count"></span></div><div id="grid" class="grid"></div></main>

<div id="detail" class="modal"><div class="box"><button class="x" onclick="closeModal()">×</button><div id="detailBody"></div></div></div>
<div id="login" class="modal"><div class="box small"><button class="x" onclick="closeLogin()">×</button><h2>🔐 Admin Login</h2><input id="user" placeholder="Username"><input id="pass" type="password" placeholder="Password"><button class="primary" onclick="login()">ဝင်မည်</button><small>Demo: admin / admin123</small></div></div>
